<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1e40af">
  <title>Célula Raízes • Projeto Casa 91</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="top-bar">
    <header class="header">
      <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema">🌙</button>
      <h1>Célula Raízes</h1>
      <div class="subtitle">Projeto Casa 91</div>
    </header>
    <nav class="nav">
      <a href="index.html" class="active">Dashboard</a>
      <a href="formulario.html">Jejum 21 Dias</a>
      <a href="admin.html">Admin</a>
    </nav>
  </div>

  <main class="container">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Carregando dados...</p>
    </div>

    <div id="content" class="hidden">
      <section class="cards-grid" id="cards"></section>

      <div class="cta-box">
        <a href="formulario.html" class="btn btn-primary">Lançar Tempo de Oração</a>
      </div>
    </div>

    <div id="error" class="alert alert-error hidden"></div>
  </main>

  <footer class="footer">Célula Raízes • Igreja Videira de Ourinhos</footer>

  <script type="module">
    import * as FB from "./js/firebase.js";
    window.FB = FB;
  </script>
  <script src="js/app.js"></script>
  <script type="module">
    async function carregarDashboard() {
      const loading = document.getElementById("loading");
      const content = document.getElementById("content");
      const errorEl = document.getElementById("error");

      try {
        const alvosRes = await window.FB.getAlvos();
        const alvos = alvosRes.alvos || {};

        const horasMeta = Number(alvos.HorasMeta) || 158;
        const minutosTotais = Number(alvos.MinutosTotais) || 0;
        const horasAtualFmt = formatHorasMinutos(minutosTotais);
        const visitasMeta = Number(alvos.VisitasMeta) || 3;
        const visitasAtual = Number(alvos.VisitasAtual) || 0;
        const batismosMeta = Number(alvos.BatismosMeta) || 3;
        const batismosAtual = Number(alvos.BatismosAtual) || 0;

        // Progresso em minutos (meta em horas × 60)
        const pctHoras = Math.min(100, Math.round((minutosTotais / (horasMeta * 60)) * 100));
        const pct = (a, m) => Math.min(100, Math.round((a / m) * 100));
        const cls = p => p >= 80 ? "" : p >= 40 ? "warning" : "danger";

        document.getElementById("cards").innerHTML = `
          <div class="card">
            <div class="card-title">Horas de Oração</div>
            <div class="card-value">${horasAtualFmt} <small style="font-size:0.9rem;font-weight:500;">/ ${horasMeta}h</small></div>
            <div class="progress-bar"><div class="progress-fill ${cls(pctHoras)}" style="width:${pctHoras}%"></div></div>
            <div class="card-meta">${pctHoras}% do alvo</div>
          </div>
          <div class="card">
            <div class="card-title">Visitas (Casas)</div>
            <div class="card-value">${visitasAtual} <small style="font-size:0.9rem;font-weight:500;">/ ${visitasMeta}</small></div>
            <div class="progress-bar"><div class="progress-fill ${cls(pct(visitasAtual,visitasMeta))}" style="width:${pct(visitasAtual,visitasMeta)}%"></div></div>
            <div class="card-meta">${pct(visitasAtual,visitasMeta)}% do alvo</div>
          </div>
          <div class="card">
            <div class="card-title">Batismo</div>
            <div class="card-value">${batismosAtual} <small style="font-size:0.9rem;font-weight:500;">/ ${batismosMeta}</small></div>
            <div class="progress-bar"><div class="progress-fill ${cls(pct(batismosAtual,batismosMeta))}" style="width:${pct(batismosAtual,batismosMeta)}%"></div></div>
            <div class="card-meta">${pct(batismosAtual,batismosMeta)}% do alvo</div>
          </div>
          <div class="card">
            <div class="card-title">Conversão / Vidas</div>
            <div class="card-value" style="font-size:1.25rem;">${alvos.Conversao || "5 por Membro"}</div>
            <div class="card-meta">Lembrete para os irmãos</div>
          </div>
        `;

        loading.classList.add("hidden");
        content.classList.remove("hidden");
      } catch (err) {
        loading.classList.add("hidden");
        errorEl.textContent = err.message || "Erro ao carregar dados.";
        errorEl.classList.remove("hidden");
        console.error(err);
      }
    }
    carregarDashboard();
  </script>
</body>
</html>
