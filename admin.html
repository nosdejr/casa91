<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1e40af">
  <title>Admin | Célula Raízes</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    .pagination button {
      width: auto;
      min-width: 36px;
      padding: 0.4rem 0.7rem;
      font-size: 0.85rem;
    }
    .pagination .page-info {
      font-size: 0.85rem;
      color: var(--text-muted);
      padding: 0 0.4rem;
    }
    .filtro-box {
      margin-bottom: 0.9rem;
    }
    .filtro-box input {
      width: 100%;
      padding: 0.6rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 0.95rem;
      background: var(--bg);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <header class="header">
      <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema">🌙</button>
      <h1>Célula Raízes</h1>
      <div class="subtitle">Projeto Casa 91</div>
    </header>
    <nav class="nav">
      <a href="index.html">Dashboard</a>
      <a href="formulario.html">Jejum 21 Dias</a>
      <a href="admin.html" class="active">Admin</a>
    </nav>
  </div>

  <main class="container" id="mainContainer">
    <div id="loginBox" class="admin-login form-section">
      <h2>Acesso Administrativo</h2>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite a senha" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" id="btnLogin" onclick="fazerLogin()">Entrar</button>
    </div>
  </main>

  <footer class="footer">Célula Raízes • Igreja Videira de Ourinhos</footer>

  <script type="module">
    import * as FB from "./js/firebase.js";
    window.FB = FB;
  </script>
  <script src="js/app.js"></script>
  <script type="module">
    // Estado da paginação e filtro
    let todosRegistros = [];
    let paginaAtual = 1;
    const ITENS_POR_PAGINA = 10;
    let filtroNome = "";

    window.FB.onAuthChange((user) => {
      if (user) {
        renderAdmin();
      } else {
        document.getElementById("mainContainer").innerHTML = `
          <div id="loginBox" class="admin-login form-section">
            <h2>Acesso Administrativo</h2>
            <div class="form-group">
              <label for="email">E-mail</label>
              <input type="email" id="email" placeholder="seu@email.com" autocomplete="username">
            </div>
            <div class="form-group">
              <label for="senha">Senha</label>
              <input type="password" id="senha" placeholder="Digite a senha" autocomplete="current-password">
            </div>
            <button class="btn btn-primary" id="btnLogin" onclick="fazerLogin()">Entrar</button>
          </div>
        `;
        document.getElementById("senha")?.addEventListener("keypress", (e) => {
          if (e.key === "Enter") fazerLogin();
        });
      }
    });

    async function fazerLogin() {
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const btn = document.getElementById("btnLogin");

      if (!email || !senha) {
        showAlert(null, "Preencha e-mail e senha", "error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Entrando...";

      try {
        await window.FB.login(email, senha);
      } catch (err) {
        console.error(err);
        let msg = "Erro ao entrar";
        if (err.code === "auth/user-not-found" || err.code === "auth/wrong-password" || err.code === "auth/invalid-credential") {
          msg = "E-mail ou senha incorretos";
        } else if (err.code === "auth/too-many-requests") {
          msg = "Muitas tentativas. Tente novamente mais tarde.";
        }
        showAlert(null, msg, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    }

    async function sair() {
      try {
        await window.FB.logout();
      } catch (err) {
        showAlert(null, err.message, "error");
      }
    }

    function renderAdmin() {
      const container = document.getElementById("mainContainer");
      container.innerHTML = `
        <div id="adminContent">

          <!-- 1. Alvos / Progresso -->
          <section class="form-section admin-section">
            <h3>Alvos / Progresso</h3>
            <div class="form-group">
              <label>Visitas Atuais</label>
              <input type="number" id="visitasAtual" min="0">
            </div>
            <div class="form-group">
              <label>Batismos Atuais</label>
              <input type="number" id="batismosAtual" min="0">
            </div>
            <button class="btn btn-primary" onclick="salvarAlvos()">Salvar Alvos</button>
          </section>

          <!-- 2. Ranking Completo -->
          <section class="form-section admin-section">
            <h3>Ranking Completo</h3>
            <ul class="ranking-list" id="rankingAdmin"></ul>
          </section>

          <!-- 3. Registros de Oração (com filtro + paginação) -->
          <section class="form-section admin-section">
            <h3>Registros de Oração</h3>
            <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:0.75rem;text-align:center;">
              Use o lápis para editar os minutos ou a lixeira para excluir.
            </p>

            <div class="filtro-box">
              <input type="text" id="filtroNome" placeholder="Filtrar por nome do membro..." oninput="aplicarFiltro()">
            </div>

            <div class="table-responsive">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Nome</th>
                    <th>Data</th>
                    <th>Dia</th>
                    <th>Min</th>
                    <th style="width:110px;">Ações</th>
                  </tr>
                </thead>
                <tbody id="tabelaRegistros"></tbody>
              </table>
            </div>

            <div class="pagination" id="paginacao"></div>
          </section>

          <!-- 4. Membros -->
          <section class="form-section admin-section">
            <h3>
              Membros
              <button class="btn btn-success" style="width:auto;padding:0.4rem 0.8rem;font-size:0.85rem;" onclick="mostrarAddMembro()">+ Adicionar</button>
            </h3>

            <div id="addMembroBox" class="hidden mb-2">
              <div class="form-group">
                <input type="text" id="novoMembro" placeholder="Nome do irmão">
              </div>
              <button class="btn btn-success" onclick="adicionarMembro()">Salvar Nome</button>
            </div>

            <div class="table-responsive">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Membros</th>
                    <th style="width:110px;">Ações</th>
                  </tr>
                </thead>
                <tbody id="listaMembros"></tbody>
              </table>
            </div>
          </section>

          <button class="btn btn-danger" style="width:100%;margin-top:1rem;" onclick="sair()">Sair</button>
        </div>
      `;

      carregarTudo();
    }

    function getRegistrosFiltrados() {
      if (!filtroNome.trim()) return todosRegistros;
      const termo = filtroNome.trim().toLowerCase();
      return todosRegistros.filter(r => (r.Nome || "").toLowerCase().includes(termo));
    }

    function renderRegistros() {
      const filtrados = getRegistrosFiltrados();
      const totalPaginas = Math.max(1, Math.ceil(filtrados.length / ITENS_POR_PAGINA));

      if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
      if (paginaAtual < 1) paginaAtual = 1;

      const inicio = (paginaAtual - 1) * ITENS_POR_PAGINA;
      const pagina = filtrados.slice(inicio, inicio + ITENS_POR_PAGINA);

      const tbody = document.getElementById("tabelaRegistros");
      if (!tbody) return;

      tbody.innerHTML = pagina.length === 0
        ? '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">Nenhum registro encontrado</td></tr>'
        : pagina.map(r => `
          <tr>
            <td class="nome-membro">${r.Nome || ""}</td>
            <td>${formatDateBR(r.Data)}</td>
            <td>${r.DiaSemana || ""}</td>
            <td>${r.Minutos || 0}</td>
            <td>
              <div class="action-btns">
                <button class="btn btn-primary btn-icon" title="Editar" onclick="editarRegistro('${r.id}', '${(r.Nome||"").replace(/'/g, "\\'")}', '${r.Data}', '${r.DiaSemana}', ${r.Minutos})">✏️</button>
                <button class="btn btn-danger btn-icon" title="Excluir" onclick="excluirRegistro('${r.id}')">🗑️</button>
              </div>
            </td>
          </tr>
        `).join("");

      // Paginação
      const pagEl = document.getElementById("paginacao");
      if (!pagEl) return;

      if (filtrados.length <= ITENS_POR_PAGINA) {
        pagEl.innerHTML = filtrados.length > 0
          ? `<span class="page-info">${filtrados.length} registro(s)</span>`
          : "";
        return;
      }

      pagEl.innerHTML = `
        <button class="btn btn-primary" onclick="irParaPagina(1)" ${paginaAtual === 1 ? "disabled" : ""}>⏮</button>
        <button class="btn btn-primary" onclick="irParaPagina(${paginaAtual - 1})" ${paginaAtual === 1 ? "disabled" : ""}>◀</button>
        <span class="page-info">Página ${paginaAtual} de ${totalPaginas} (${filtrados.length} registros)</span>
        <button class="btn btn-primary" onclick="irParaPagina(${paginaAtual + 1})" ${paginaAtual === totalPaginas ? "disabled" : ""}>▶</button>
        <button class="btn btn-primary" onclick="irParaPagina(${totalPaginas})" ${paginaAtual === totalPaginas ? "disabled" : ""}>⏭</button>
      `;
    }

    window.irParaPagina = function(p) {
      paginaAtual = p;
      renderRegistros();
    };

    window.aplicarFiltro = function() {
      const input = document.getElementById("filtroNome");
      filtroNome = input ? input.value : "";
      paginaAtual = 1;
      renderRegistros();
    };

    async function carregarTudo() {
      try {
        const [alvosRes, membrosRes, registrosRes, rankingRes] = await Promise.all([
          window.FB.getAlvos(),
          window.FB.getMembros(),
          window.FB.getRegistros(),
          window.FB.getRanking()
        ]);

        // Alvos
        const alvos = alvosRes.alvos || {};
        document.getElementById("visitasAtual").value = alvos.VisitasAtual || 0;
        document.getElementById("batismosAtual").value = alvos.BatismosAtual || 0;

        // Ranking
        const rankingEl = document.getElementById("rankingAdmin");
        const ranking = rankingRes.ranking || [];
        rankingEl.innerHTML = ranking.length === 0
          ? '<li style="color:var(--text-muted);text-align:center;">Sem dados</li>'
          : ranking.map((r, i) => `
            <li class="ranking-item">
              <span class="ranking-pos">${i + 1}º</span>
              <span class="ranking-name">${r.nome}</span>
              <span class="ranking-hours">${formatHorasMinutos(r.minutos)} (${r.minutos} min)</span>
            </li>
          `).join("");

        // Registros (guarda todos e renderiza com paginação)
        todosRegistros = registrosRes.registros || [];
        paginaAtual = 1;
        renderRegistros();

        // Membros
        const tbodyMembros = document.getElementById("listaMembros");
        const membros = membrosRes.membros || [];
        tbodyMembros.innerHTML = membros.length === 0
          ? '<tr><td colspan="2" style="text-align:center;color:var(--text-muted);">Nenhum membro cadastrado</td></tr>'
          : membros.map(m => `
            <tr>
              <td class="nome-membro">${m.nome}</td>
              <td>
                <div class="action-btns">
                  <button class="btn btn-primary btn-icon" title="Editar" onclick="editarMembro('${m.id}', '${m.nome.replace(/'/g, "\\'")}')">✏️</button>
                  <button class="btn btn-danger btn-icon" title="Excluir" onclick="excluirMembro('${m.id}', '${m.nome.replace(/'/g, "\\'")}')">🗑️</button>
                </div>
              </td>
            </tr>
          `).join("");

      } catch (err) {
        showAlert(null, err.message, "error");
      }
    }

    // Funções globais
    window.mostrarAddMembro = function() {
      document.getElementById("addMembroBox").classList.toggle("hidden");
    };

    window.adicionarMembro = async function() {
      const nome = document.getElementById("novoMembro").value.trim();
      if (!nome) {
        showAlert(null, "Digite um nome", "error");
        return;
      }
      try {
        await window.FB.addMembro(nome);
        showAlert(null, "Membro adicionado!", "success");
        document.getElementById("novoMembro").value = "";
        document.getElementById("addMembroBox").classList.add("hidden");
        carregarTudo();
      } catch (err) {
        showAlert(null, err.message, "error");
      }
    };

    window.editarMembro = async function(id, nomeAtual) {
      const novoNome = prompt("Editar nome do membro:", nomeAtual);
      if (novoNome === null || novoNome.trim() === "") return;
      try {
        await window.FB.updateMembro(id, novoNome.trim());
        showAlert(null, "Nome atualizado!", "success");
        carregarTudo();
      } catch (err) {
        showAlert(null, err.message, "error");
      }
    };

    window.excluirMembro = async function(id, nome) {
      if (!confirm(`Excluir o membro "${nome}"?`)) return;
      try {
        await window.FB.deleteMembro(id);
        showAlert(null, "Membro excluído", "success");
        carregarTudo();
      } catch (err) {
        showAlert(null, err.message, "error");
      }
    };

    window.editarRegistro = async function(id, nome, data, diaSemana, minutos) {
      const novo = prompt(`Editar minutos de ${nome}\n${diaSemana} ${formatDateBR(data)}\n\nDigite o novo valor:`, minutos);
      if (novo === null) return;
      const valor = parseInt(novo);
      if (isNaN(valor) || valor < 0) {
        showAlert(null, "Valor inválido", "error");
        return;
      }
      try {
        await window.FB.updateRegistro(id, valor);
        showAlert(null, "Registro atualizado!", "success");
        carregarTudo();
      } catch (err) {
        showAlert(null, err.message, "error");
      }
    };

    window.excluirRegistro = async function(id) {
      if (!confirm("Excluir este registro de oração?")) return;
      try {
        await window.FB.deleteRegistro(id);
        showAlert(null, "Registro excluído", "success");
        carregarTudo();
      } catch (err) {
        showAlert(null, err.message, "error");
      }
    };

    window.salvarAlvos = async function() {
      const visitas = Number(document.getElementById("visitasAtual").value) || 0;
      const batismos = Number(document.getElementById("batismosAtual").value) || 0;
      try {
        await window.FB.updateAlvos({
          VisitasAtual: visitas,
          BatismosAtual: batismos
        });
        showAlert(null, "Alvos atualizados!", "success");
      } catch (err) {
        showAlert(null, err.message, "error");
      }
    };

    window.fazerLogin = fazerLogin;
    window.sair = sair;
  </script>
</body>
</html>
